name: Timeline Omitted UI Fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_timeline_omitted_ui.py'
      - '.github/workflows/timeline-omitted-ui-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch omitted-state rendering
        run: |
          set -Eeuo pipefail
          python scripts/patch_timeline_omitted_ui.py
          git diff --check
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit validated UI fix
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/SectionViewer.jsx
          if git diff --cached --quiet; then
            echo 'No UI changes to commit.'
            exit 0
          fi
          git commit -m 'Show omitted sections explicitly in historical timeline'
          git push origin HEAD:main
